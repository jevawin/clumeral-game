# Dependabot (added 2026-10-04). Weekly update PRs against main, tested by the
# normal CI (ci-smoke + ci-matrix) before anyone merges them. Nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Target staging, not the default branch. Work lands on staging and reaches
    # main only in a release, so main's package.json is routinely scores of
    # commits behind staging's — on 2026-10-31 it was 180, with a different
    # vitest major on each side. Dependabot PRs raised against main therefore
    # targeted a manifest that the next release would replace wholesale, and
    # eight of them piled up waiting on a release rather than on review.
    # Pointing it at staging puts dependency bumps through the normal
    # work-branch pipeline instead. The config itself is still read from the
    # default branch — that is a GitHub requirement, not a choice.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      # Workers runtime pieces ought to move together (wrangler, vite plugin,
      # vitest pool, workers-types) or local dev and tests drift apart.
      #
      # This group is not reliably achieving that. From Dependabot's first run,
      # 2026-10-05: #321 took wrangler on its own "in the cloudflare group",
      # while #322 put @cloudflare/vite-plugin and the vitest pool into
      # minor-and-patch. Both match this group's @cloudflare/* pattern and this
      # group is listed first, so by the documented rule — "included in the
      # first group that it matches" — they should have landed here.
      #
      # A group could not have fixed the vitest problem below in any case: it
      # changes which PR a bump arrives in, it never stops the bump being
      # proposed. That is why the pin uses `ignore` and not a fourth group.
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Playwright is deliberately pinned (~1.60): a minor bump needs the
      # matching Chromium re-installed on the Pi for the dev bot's e2e runs.
      # Bump it by hand, together with `npx playwright install chromium`.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # vitest and @cloudflare/vitest-pool-workers are peer-locked, so they are
      # bumped by hand, together — same deal as Playwright above.
      #
      # The pool's peer range on vitest is "2.0.x - 3.2.x" at 0.12.x, then
      # "^4.1.0" from 0.13.0 on, with no release in between. So vitest 4 is only
      # reachable by moving both packages in one commit, and Dependabot moving
      # either one alone fails `npm ci` with ERESOLVE — every CI job then dies
      # before one test runs. That is what killed #326, #328 and #329.
      #
      # vitest 5 is reachable, but not from this package. @cloudflare/vitest-
      # pool-workers is DEPRECATED — renamed to @cloudflare/vitest-plugin — and
      # 0.23.0, its last release, declares peer vitest "^4.1.0". The successor
      # does peer "^4.1.0 || ^5.0.0" from 1.4.0 on, so vitest 5 needs that
      # migration first. We have not done it, and there is no stable-miniflare
      # version to migrate to: all 44 releases of @cloudflare/vitest-plugin,
      # 1.0.0 to 1.4.11, ship a miniflare 5 alpha or beta (as of 2026-10-31).
      # 0.19.1 remains the newest release on a stable miniflare under either
      # name. So the vitest major ignore stays — not because nothing supports
      # vitest 5, but because the only thing that does is a package we have not
      # migrated to, on a prerelease runtime.
      #
      # vitest 3 *is* compatible with the pool pinned here — 3.2.7 sits inside
      # "2.0.x - 3.2.x" and installs cleanly today. It is ignored because a major
      # test-framework bump needs a human, not because it cannot install. If
      # vitest 4 proves a big job, 3.2.7 is a legitimate stop on the way.
      #
      # Lifting these three entries is part of the vitest 4 task, not a bump on
      # its own — see "Outstanding actions" in CLAUDE.md for what that task owes.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # `dependency-name` does take a `*` wildcard, but GitHub documents no
      # scoped-npm example, so this entry is unproven. It is load-bearing: #329
      # was filed against @vitest/mocker, which is not in package.json at all —
      # Dependabot tracks it transitively. The vitest entry above may cover that
      # case by itself, since the resolution forces the two together, but that is
      # not documented either. Confirm both on the next scheduled run.
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # 0.12.21 -> 0.13.0 is a *minor* in Dependabot's reading of a 0.x version
      # — proven, not assumed: #326 put a 0.12 -> 0.22 jump inside the
      # minor-and-patch group, which only accepts minor and patch. And 0.13.0 is
      # exactly where the vitest 4 peer begins. So minor has to be ignored here,
      # not only major.
      #
      # Be clear what that costs. 0.12.21 is the LAST 0.12.x release, so patch is
      # allowed in principle but none will ever come: this is a permanent pin,
      # security patches included. The pool hard-depends on wrangler 4.72.0 and
      # miniflare 4.20260310.0 while root wrangler and @cloudflare/vite-plugin
      # keep bumping, so tests/worker/** runs against an ever-older workerd than
      # dev, build and deploy do. Taken deliberately: an ageing test runtime
      # beats a permanently red CI. It ends when the vitest 4 task lands.
      - dependency-name: "@cloudflare/vitest-pool-workers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @cloudflare/workers-types majors are ignored because a types-only bump
      # drags a real runtime with it. `wrangler` peers the types, and the range
      # moves with the major: 4.80.0 wants "^4.20260401.1", 4.146.0 wants
      # "^5.20261001.1". So taking the types to 5 takes root wrangler to 4.146.0,
      # which brings miniflare 5 alpha and a newer workerd — while
      # @cloudflare/vite-plugin still pins wrangler 4.80.0 on miniflare 4. The
      # two halves then disagree about the on-disk D1 format: `npm run e2e:db`
      # writes `.wrangler` with the new workerd, `vite preview` cannot read it
      # back, and e2e dies before a test runs. #331 carries the full diagnosis,
      # including why the CI log never shows the real error.
      #
      # "@cloudflare/vite-plugin still pins wrangler 4.80.0" is true of the
      # version in package.json, NOT of the package — see the entry below, which
      # is what keeps it true.
      #
      # Major only, and that is deliberate: 4.x is still being released
      # (4.20260702.1 as of 2026-10-31, against 4.20260403.1 here), those bumps
      # sit inside wrangler 4.80.0's peer range, and we want them.
      #
      # Dependabot refiles this one fast — #325 was closed and came back as #334
      # within the hour, which is why an ignore and not just a close.
      #
      # This entry is step one of #331, which then bumps @cloudflare/vite-plugin,
      # wrangler and @cloudflare/workers-types together onto one miniflare.
      # Remove it in that PR.
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
      # @cloudflare/vite-plugin minors drag a PRERELEASE runtime in, which is the
      # same hazard as the entry above arriving by an unguarded route. The entry
      # above reasons from this package holding wrangler 4.80.0 on miniflare 4;
      # that is a property of 1.31.0, not of the package, and nothing was stopping
      # a plain minor from undoing it. #344 proposed exactly that and was closed.
      #
      # Measured against the registry on 2026-11-01 — these are exact pins in the
      # plugin's own `dependencies`, not ranges:
      #
      #   1.31.0 (ours) -> wrangler 4.80.0  / miniflare 4.20260401.0
      #   1.49.0        -> wrangler 4.116.0 / miniflare 4.20260730.0   <- last on 4
      #   1.49.1        -> wrangler 4.117.0 / miniflare 5.20260730.0-alpha
      #   1.66.0 (head) -> wrangler 4.154.0 / miniflare 5.20261023.1-beta
      #
      # Note WHERE that crossover sits: 1.49.0 -> 1.49.1 is a **patch**. So
      # "patches are safe for this package" is false in general, and anyone
      # loosening this entry on that assumption will ship an alpha workerd. It is
      # safe only because a patch-only allowance keeps us inside 1.31.x, which
      # stays on miniflare 4 (1.31.2 -> wrangler 4.81.1 / miniflare 4.20260409.0).
      #
      # Patch is deliberately still allowed, same as the wrangler/@cloudflare group
      # above, but it is not quite free: 1.31.2 peers `wrangler ^4.81.1` while root
      # pins 4.80.0, so a patch bump trades a prerelease runtime for a peer warning.
      # That reconciliation is #331's job, not this entry's.
      #
      # Step two of #331, beside the @cloudflare/workers-types entry above. Remove
      # both in that PR, which bumps the plugin, wrangler and the types together
      # onto one miniflare.
      - dependency-name: "@cloudflare/vite-plugin"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # wrangler is the DIRECT route to the same prerelease runtime, and until now
      # the only unguarded one: the cloudflare group above allows its minors, so
      # Dependabot proposed 4.80.0 -> 4.155.0 in #354. That PR's own lockfile took
      # root miniflare 4.20260401.0 -> 5.20261023.2-beta and workerd
      # 1.20260401.1 -> 1.20261023.1, which is #325 verbatim: `npm run e2e:db`
      # writes `.wrangler` with the new workerd, `vite preview` cannot read it
      # back, and e2e dies before a test runs.
      #
      # Where the crossover actually sits, measured 2026-11-01:
      #
      #   4.80.0 (ours) -> miniflare 4.20260401.0
      #   4.81.1        -> miniflare 4.20260409.0
      #   4.116.0       -> miniflare 4.20260730.0   <- last on 4
      #   4.117.0       -> miniflare 5.20260730.0-alpha
      #   4.155.0       -> miniflare 5.20261023.2-beta
      #
      # So minors are not inherently unsafe — everything up to 4.116.0 is on
      # miniflare 4. But Dependabot proposes the LATEST allowed version, not the
      # latest safe one, and `update-types` cannot express "minors below 4.117.0".
      #
      # `versions: [">=4.117.0"]` COULD express it, and is deliberately not used:
      # @cloudflare/vite-plugin@1.31.0 pins wrangler 4.80.0 exactly, so raising
      # root to 4.116.0 would put two different miniflare 4 builds in one tree
      # (root 4.20260730.0, the plugin's 4.20260401.0) with different workerds —
      # the same split that #325 broke on, in miniflare-4 flavour. Worth doing,
      # with an e2e run behind it, which makes it #331's job and not an ignore
      # entry's.
      #
      # Be clear what this costs: 4.80.0 is the last 4.80.x, so no patch will ever
      # come and this is a permanent pin, security patches included. Same bargain
      # as @cloudflare/vitest-pool-workers above, and it ends the same way — in
      # #331, which bumps the plugin, wrangler and the types together onto one
      # miniflare. Remove this with the other two there.
      - dependency-name: "wrangler"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    # Same reasoning as the npm block above.
    target-branch: staging
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
